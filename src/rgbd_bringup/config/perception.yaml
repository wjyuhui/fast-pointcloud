/**:
  ros__parameters:
    # Shared
    target_frame: base_link

cloud_workspace_node:
  ros__parameters:
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info
    output_cloud_topic: /perception/cloud_workspace
    target_frame: base_link
    depth_stride: 2
    min_depth_m: 0.2
    max_depth_m: 5.0
    passthrough_x_min: 0.2
    passthrough_x_max: 5.0
    passthrough_z_min: -1.0
    passthrough_z_max: 2.0
    voxel_leaf_m: 0.05
    tf_timeout_sec: 0.1
    # Projection mode, thread count and CPU list are supplied by perception.launch.py.

pcl_obstacle_node:
  ros__parameters:
    input_cloud_topic: /perception/cloud_workspace
    target_frame: base_link
    enable_sor: false
    sor_mean_k: 20
    sor_stddev: 2.0
    ground_method: ransac   # ransac | height  (ransac fails -> height fallback)
    ground_distance_thresh_m: 0.05
    ransac_max_iterations: 300
    height_thresh_m: 0.15
    cluster_tolerance_m: 0.15
    cluster_min_points: 20
    cluster_max_points: 25000
    max_clusters: 30
    enable_clustering: false
    ransac_enable_openmp: false
    ransac_openmp_threads: 4
    ransac_enable_neon: false
    profiling_enable: true
    profiling_warmup_frames: 30
    profiling_window_frames: 1000

bev_node:
  ros__parameters:
    input_cloud_topic: /perception/cloud_obstacles
    frame_id: base_link
    x_min_m: 0.0
    x_max_m: 5.0
    y_min_m: -2.5
    y_max_m: 2.5
    resolution_m: 0.05
    z_min_m: 0.05
    z_max_m: 1.8
    occupied_count: 5
    publish_markers: false

yolo_3d_node:
  ros__parameters:
    # Filled by launch with share path if empty
    model_path: ""
    enable_detection: true
    conf_thresh: 0.35
    iou_thresh: 0.45
    imgsz: 640
    class_whitelist: [0]  # person only
    depth_percentile: 50.0
    trim_low: 0.1
    trim_high: 0.9
    min_valid_pixels: 30
    center_crop_ratio: 0.6
    min_depth_m: 0.2
    max_depth_m: 5.0
    target_frame: base_link
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info

# Camera mount TF is published by perception.launch.py (static_transform_publisher),
# not via this params file (ROS2 params YAML requires ros__parameters under each node).
